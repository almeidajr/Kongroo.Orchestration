services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: kongroo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/new-secrets.ps1}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      # TCP, not the socket: the first-run init server listens on the socket only, then restarts.
      test: ["CMD-SHELL", "pg_isready -h localhost -U kongroo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.3-management
    environment:
      RABBITMQ_DEFAULT_USER: kongroo
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?run scripts/new-secrets.ps1}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: kongroo
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?run scripts/new-secrets.ps1}
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:9.5.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?run scripts/new-secrets.ps1}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 1g
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "printf 'user = \"elastic:%s\"\\n' \"$$ELASTIC_PASSWORD\" | curl -fs -K - http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  identity-api:
    image: josealmeidajr/kongroo-identity:dev
    build:
      context: ../Kongroo.Identity
      dockerfile: Dockerfile
    ports:
      - "5101:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: ${IDENTITY_DATABASE_CONNECTION_STRING:?run scripts/new-secrets.ps1}
      Jwt__Issuer: "Kongroo.Identity.Api"
      Jwt__Audience: "Kongroo.Identity.Api"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?run scripts/new-secrets.ps1}
      Jwt__AccessTokenLifetimeMinutes: "15"
      BootstrapAdmin__Username: "developer"
      BootstrapAdmin__Email: "developer@kongroo.dev"
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:?run scripts/new-secrets.ps1}
      BootstrapAdmin__Name: "Developer"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__User: "kongroo"
      RabbitMq__Pass: ${RABBITMQ_PASSWORD:?run scripts/new-secrets.ps1}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  catalog-api:
    image: josealmeidajr/kongroo-catalog:dev
    build:
      context: ../Kongroo.Catalog
      dockerfile: Dockerfile
    ports:
      - "5102:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: ${CATALOG_DATABASE_CONNECTION_STRING:?run scripts/new-secrets.ps1}
      Jwt__Issuer: "Kongroo.Identity.Api"
      Jwt__Audience: "Kongroo.Identity.Api"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?run scripts/new-secrets.ps1}
      Jwt__AccessTokenLifetimeMinutes: "15"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__User: "kongroo"
      RabbitMq__Pass: ${RABBITMQ_PASSWORD:?run scripts/new-secrets.ps1}
      Mongo__ConnectionString: ${MONGO_CONNECTION_STRING:?run scripts/new-secrets.ps1}
      Mongo__Database: "kongroo_catalog"
      ConnectionStrings__Redis: ${REDIS_CONNECTION_STRING:?run scripts/new-secrets.ps1}
      Search__Uri: "http://elasticsearch:9200"
      Search__Username: "elastic"
      Search__Password: ${ELASTIC_PASSWORD:?run scripts/new-secrets.ps1}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Started, not healthy: a search outage must not keep Catalog down.
      elasticsearch:
        condition: service_started

  payments-api:
    image: josealmeidajr/kongroo-payments:dev
    build:
      context: ../Kongroo.Payments
      dockerfile: Dockerfile
    ports:
      - "5103:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: ${PAYMENTS_DATABASE_CONNECTION_STRING:?run scripts/new-secrets.ps1}
      Jwt__Issuer: "Kongroo.Identity.Api"
      Jwt__Audience: "Kongroo.Identity.Api"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?run scripts/new-secrets.ps1}
      Jwt__AccessTokenLifetimeMinutes: "15"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__User: "kongroo"
      RabbitMq__Pass: ${RABBITMQ_PASSWORD:?run scripts/new-secrets.ps1}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  kong:
    image: kong:3.9
    entrypoint: ["/bin/sh", "-c"]
    command:
      - sed "s/__JWT_SIGNING_KEY__/$$JWT_SIGNING_KEY/" /kong/declarative/kong.yaml > /tmp/kong.yaml
        && exec /docker-entrypoint.sh kong docker-start
    environment:
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?run scripts/new-secrets.ps1}
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yaml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: "off"
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./k8s/kong/kong.yaml:/kong/declarative/kong.yaml:ro
    ports:
      - "8000:8000"
      - "8100:8100"
    networks:
      default:
        aliases:
          - kong-status
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - identity-api
      - catalog-api
      - payments-api

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./k8s/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - kong

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run scripts/new-secrets.ps1}
    volumes:
      - ./k8s/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./k8s/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  rabbitmq-data:
  mongodb-data:
