services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: kongroo
      POSTGRES_PASSWORD: development
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kongroo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.3-management
    environment:
      RABBITMQ_DEFAULT_USER: kongroo
      RABBITMQ_DEFAULT_PASS: development
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: kongroo
      MONGO_INITDB_ROOT_PASSWORD: development
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  identity-api:
    image: josealmeidajr/kongroo-identity:dev
    build:
      context: ../Kongroo.Identity
      dockerfile: Dockerfile
    ports:
      - "5101:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Database=kongroo_identity;Username=kongroo;Password=development"
      Jwt__Issuer: "Kongroo.Identity.Api"
      Jwt__Audience: "Kongroo.Identity.Api"
      Jwt__SigningKey: "Development.SigningKey.AtLeast32Characters!"
      Jwt__AccessTokenLifetimeMinutes: "15"
      BootstrapAdmin__Username: "developer"
      BootstrapAdmin__Email: "developer@kongroo.dev"
      BootstrapAdmin__Password: "Sup3rSecure!"
      BootstrapAdmin__Name: "Developer"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__User: "kongroo"
      RabbitMq__Pass: "development"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  catalog-api:
    image: josealmeidajr/kongroo-catalog:dev
    build:
      context: ../Kongroo.Catalog
      dockerfile: Dockerfile
    ports:
      - "5102:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Database=kongroo_catalog;Username=kongroo;Password=development"
      Jwt__Issuer: "Kongroo.Identity.Api"
      Jwt__Audience: "Kongroo.Identity.Api"
      Jwt__SigningKey: "Development.SigningKey.AtLeast32Characters!"
      Jwt__AccessTokenLifetimeMinutes: "15"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__User: "kongroo"
      RabbitMq__Pass: "development"
      Mongo__ConnectionString: "mongodb://kongroo:development@mongodb:27017/kongroo_catalog?authSource=admin"
      Mongo__Database: "kongroo_catalog"
      ConnectionStrings__Redis: "redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  payments-api:
    image: josealmeidajr/kongroo-payments:dev
    build:
      context: ../Kongroo.Payments
      dockerfile: Dockerfile
    ports:
      - "5103:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Database=kongroo_payments;Username=kongroo;Password=development"
      Jwt__Issuer: "Kongroo.Identity.Api"
      Jwt__Audience: "Kongroo.Identity.Api"
      Jwt__SigningKey: "Development.SigningKey.AtLeast32Characters!"
      Jwt__AccessTokenLifetimeMinutes: "15"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__User: "kongroo"
      RabbitMq__Pass: "development"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yaml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: "off"
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./k8s/kong/kong.yaml:/kong/declarative/kong.yaml:ro
    ports:
      - "8000:8000"
      - "8100:8100"
    networks:
      default:
        aliases:
          - kong-status
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - identity-api
      - catalog-api
      - payments-api

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./k8s/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - kong

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: development
    volumes:
      - ./k8s/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./k8s/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  notifications-api:
    image: josealmeidajr/kongroo-notifications:dev
    build:
      context: ../Kongroo.Notifications
      dockerfile: Dockerfile
    ports:
      - "5104:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMq__Host: "rabbitmq"
      RabbitMq__User: "kongroo"
      RabbitMq__Pass: "development"
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
  mongodb-data:
