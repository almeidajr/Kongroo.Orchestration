apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kongroo

resources:
  - namespace.yaml
  - aws-credentials.secret.yaml
  - postgres/configmap.yaml
  - postgres/pvc.yaml
  - postgres/deployment.yaml
  - postgres/service.yaml
  - rabbitmq/configmap.yaml
  - rabbitmq/pvc.yaml
  - rabbitmq/deployment.yaml
  - rabbitmq/service.yaml
  - kong/deployment.yaml
  - kong/service.yaml
  - kong/status-service.yaml
  - mongodb/pvc.yaml
  - mongodb/deployment.yaml
  - mongodb/service.yaml
  - redis/deployment.yaml
  - redis/service.yaml
  - elasticsearch/deployment.yaml
  - elasticsearch/service.yaml
  - prometheus/deployment.yaml
  - prometheus/service.yaml
  - grafana/deployment.yaml
  - grafana/service.yaml
  - identity
  - catalog
  - payments

configMapGenerator:
  - name: kong-declarative
    files:
      - kong/kong.yaml
  - name: prometheus-config
    files:
      - prometheus/prometheus.yml
  - name: grafana-datasources
    files:
      - grafana/provisioning/datasources/datasource.yaml
  - name: grafana-dashboard-providers
    files:
      - grafana/provisioning/dashboards/dashboards.yaml
  - name: grafana-dashboards
    files:
      - grafana/dashboards/kongroo.json

images:
  - name: josealmeidajr/kongroo-identity
    newTag: "8aa3e7c31bb0188bdd7669ed37828fd51fa05298"
  - name: josealmeidajr/kongroo-catalog
    newTag: "d51002fc7c6af794a72ad53572b6105930ff2919"
  - name: josealmeidajr/kongroo-payments
    newTag: "3b491dfff3adeefbcce81385333e704b2d998bf9"
