global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: identity-api
    metrics_path: /metrics
    static_configs:
      - targets: ["identity-api:8080"]

  - job_name: catalog-api
    metrics_path: /metrics
    static_configs:
      - targets: ["catalog-api:8080"]

  - job_name: payments-api
    metrics_path: /metrics
    static_configs:
      - targets: ["payments-api:8080"]

  - job_name: kong
    metrics_path: /metrics
    static_configs:
      - targets: ["kong-status:8100"]
