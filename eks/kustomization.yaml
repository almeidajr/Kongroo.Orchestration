apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# EKS overlay on the local k3s manifests. ECR images at each repo's master SHA and the cloud-search component are set by
# apply.ps1 at render time.
resources:
  - ../k8s
  - storageclass.yaml

# SNS/SQS replaces RabbitMQ; pods reach the node's LabRole credentials through IMDSv2. The local Elasticsearch goes in the
# cloud-search component, which apply.ps1 adds unless -LocalSearch.
patches:
  - target:
      name: ^(rabbitmq|rabbitmq-config|rabbitmq-pvc|aws-credentials)$
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Unused
      metadata:
        name: unused
  # Kong's Classic LB is the only public entry point on EKS; Grafana is reached through kubectl port-forward.
  - target:
      kind: Service
      name: ^grafana$
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP

replicas:
  - name: identity-api
    count: 2
  - name: catalog-api
    count: 2
  - name: payments-api
    count: 2
